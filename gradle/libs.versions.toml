# Catalogo unico de versiones. Toda dependencia nueva se declara aqui,
# no dentro de app/build.gradle.kts, para que exista un solo lugar donde mirar.
#
# REGLA DE ESTE PROYECTO: no se usa la version mas nueva por defecto, sino la mas
# nueva compatible con compileSdk 36 (la unica plataforma instalada). Antes de fijar
# una dependencia nueva, comprobar su minCompileSdk. Ver BITACORA.md #004.
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.18.0"        # 1.19.0 exige compileSdk 37
lifecycle = "2.10.0"      # 2.11.0 exige compileSdk 37
activityCompose = "1.12.4"  # 1.13.0 exige compileSdk 37
credentials = "1.6.0"     # minCompileSdk 35 (comprobado)
playServicesAuth = "22.0.0"  # minCompileSdk 1 (comprobado)
googleId = "1.2.0"        # sin minCompileSdk (comprobado)
work = "2.11.2"           # minCompileSdk 35 (comprobado)
composeBom = "2026.06.00" # fija Compose 1.11.3; el 2026.08 trae 1.12 y exige compileSdk 37

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# Inicio de sesion con Google (Tarea 2). Se usa Credential Manager, que es el metodo
# actual; el antiguo "Google Sign-In" esta descontinuado y no se usa.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-id = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Sincronizacion en segundo plano cuando vuelve la conexion (Tarea 8).
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
